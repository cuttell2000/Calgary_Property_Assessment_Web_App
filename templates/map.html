<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map of {{ community_name }}</title>
    <style>
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }
        .container { 
            width: 95%; 
            max-width: 1200px;
            height: calc(100% - 70px); 
            margin: 0 auto; 
            padding: 20px 0; 
            box-sizing: border-box;
        }
        h1 {
            color: #007bff;
            margin-bottom: 10px;
            font-size: 1.8em;
            text-align: center;
        }
        .map-wrapper { 
            width: 100%; 
            height: 85vh; /* Use 85% of viewport height for a large map */
            border: 1px solid #ccc;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        .back-link {
            color: #007bff;
            text-decoration: none;
            margin-bottom: 15px;
            display: inline-block;
            font-weight: bold;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        
        /* Mobile Optimization */
        @media (max-width: 600px) {
            .container {
                padding: 10px 5px;
            }
            h1 {
                font-size: 1.5em;
            }
            .map-wrapper {
                height: 75vh; /* Reduce height slightly for better mobile scrolling */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ community_name }}</h1>
        <p><a href="{{ url_for('index') }}" class="back-link">&larr; Back to Community Selection</a></p>
        <div class="map-wrapper">
            {{ map_html | safe }}
        </div>
    </div>
</body>
</html>
